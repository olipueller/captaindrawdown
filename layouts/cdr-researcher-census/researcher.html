{{ define "main" }}

<div class="post-content researcher-profile">
  
  <!-- Breadcrumbs -->
  <nav class="breadcrumbs" aria-label="Breadcrumbs">
    <a href="/">Home</a> / 
    <a href="/cdr-researcher-census/">CDR Census</a> / 
    <a href="/cdr-researcher-census/researchers/">Researchers</a> / 
    <span>{{ .Title }}</span>
  </nav>

  <!-- Main content -->
  {{ if .Content }}
    {{ .Content }}
  {{ end }}

  <!-- Navigation -->
  <nav class="researcher-nav">
    <a href="/cdr-researcher-census/" class="nav-link">&larr; Back to Census</a>
    <a href="/cdr-researcher-census/lookup/" class="nav-link">Search & Filter</a>
    <a href="/cdr-researcher-census/researchers/" class="nav-link">Browse All Researchers</a>
  </nav>

</div>

<style>
.researcher-profile {
  max-width: 800px;
  margin: 2rem auto;
}

.breadcrumbs {
  font-size: 0.9em;
  color: var(--secondary);
  margin-bottom: 2rem;
  padding-bottom: 1rem;
  border-bottom: 1px solid var(--tertiary-bg);
}

.breadcrumbs a {
  color: var(--tertiary);
  text-decoration: none;
}

.breadcrumbs a:hover {
  text-decoration: underline;
}

.researcher-profile h2 {
  margin-top: 2rem;
  margin-bottom: 1rem;
  border-bottom: 1px solid var(--tertiary-bg);
  padding-bottom: 0.5rem;
}

.researcher-profile table {
  width: 100%;
  border-collapse: collapse;
  margin: 1rem 0;
}

.researcher-profile table th,
.researcher-profile table td {
  padding: 0.75rem;
  text-align: left;
  border-bottom: 1px solid var(--tertiary-bg);
}

.researcher-profile table th {
  font-weight: 600;
  background-color: var(--tertiary-bg);
}

.researcher-profile ol,
.researcher-profile ul {
  margin: 1rem 0;
  padding-left: 1.5rem;
}

.researcher-profile li {
  margin-bottom: 0.5rem;
  line-height: 1.6;
}

.researcher-nav {
  display: flex;
  gap: 1rem;
  margin-top: 2rem;
  padding-top: 1rem;
  border-top: 1px solid var(--tertiary-bg);
  flex-wrap: wrap;
}

.nav-link {
  padding: 0.5rem 1rem;
  background-color: var(--tertiary-bg);
  color: var(--tertiary);
  text-decoration: none;
  border-radius: 4px;
  font-size: 0.9em;
  transition: background-color 0.3s;
}

.nav-link:hover {
  background-color: var(--secondary-bg);
}

.researcher-profile script {
  display: none;
}
</style>

{{ end }}
